# Repo-owned: not listed in .rhiza/template.lock, so `make sync` leaves it alone.
#
# Loman supports pandas 2 and 3. The main CI matrix tests whichever pandas the
# lock file resolves to, which is the newest; this job pins the other end. The
# two versions differ in default datetime resolution, which the serialization
# format records rather than assumes --- so this guards against that recording
# quietly regressing and producing timestamps at the wrong scale.
name: pandas compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pandas-min:
    name: pandas ${{ matrix.pandas }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas: ["2.0", "2.3"]

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.7"
          python-version: "3.11"

      # The target lives in .rhiza/make.d/20-compat-tests.mk, so the list of
      # version-sensitive modules is defined once rather than here as well.
      - name: Run the version-sensitive tests against pandas ${{ matrix.pandas }}
        run: |
          make test-compat PANDAS_MIN=${{ matrix.pandas }}
