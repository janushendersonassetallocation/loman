[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loman"
version = "0.6.1-alpha.6"
authors = [
  { name="Ed Parcell", email="edparcell@gmail.com" },
]
description = "Loman tracks state of computations, and the dependencies between them, allowing full and partial recalculations."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries"
]
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "decorator",
    "matplotlib",
    "numpy",
    "pydotplus",
    "dill >= 0.2.5",
    "networkx >= 2.0",
    # 2.0 is the real floor: serialization records each datetime value's
    # resolution using Timestamp.unit / DatetimeIndex.unit and restores it with
    # as_unit(), all of which arrived with non-nanosecond support in pandas 2.0.
    # Without them a microsecond index would be reread as nanoseconds, which is
    # wrong timestamps rather than an import error.
    "pandas >= 2.0",
    "attrs >= 25.0"
]

[project.optional-dependencies]
ui = [
    "anywidget>=0.9",
    "traitlets>=5.14",
]
# Optional serialization codecs. Neither is required: without them large values
# are stored as .npy and compressed with zlib, which is in the standard library.
efficient = [
    "pyarrow>=15",
    "zstandard>=0.22",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "mypy>=1.0",
    "marimo>=0.15",
    "scipy>=1.16.3",
]

[project.urls]
Homepage = "https://github.com/janusassetallocation/loman"

[tool.hatch.build.targets.wheel]
packages = ["src/loman"]

[tool.deptry.package_module_name_map]
pyarrow = "pyarrow"
zstandard = "zstandard"
matplotlib = "matplotlib"
pydotplus = "pydotplus"
decorator = "decorator"
networkx = "networkx"
marimo = "marimo"
pandas = "pandas"
scipy = "scipy"
attrs = "attrs"
anywidget = "anywidget"
traitlets = "traitlets"
numpy = "numpy"
mypy = "mypy"
ruff = "ruff"
dill = "dill"

[tool.bandit]
skips = ["B301", "B403", "B404"]

[tool.interrogate]
# @overload stubs delegate their documentation to the concrete implementation,
# so they should not count against docstring coverage.
ignore-overloaded-functions = true
