site_name: Loman
site_description: Loman tracks state of computations, and the dependencies between them, allowing full and partial recalculations.
site_url: https://janushendersonassetallocation.github.io/loman
repo_url: https://github.com/janushendersonassetallocation/loman
repo_name: janushendersonassetallocation/loman

docs_dir: docs
site_dir: _book

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  version:
    provider: mike

use_directory_urls: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            show_signature_annotations: true

markdown_extensions:
  # Required for README.md to render on the Home page. docs/index.md pulls the README
  # in with a pymdownx snippet, and the README wraps its header and footer in
  # <div align="center"> for GitHub. Python-Markdown leaves markdown inside a
  # block-level HTML element alone unless md_in_html is enabled *and* the element
  # carries markdown="1" -- so without this the whole block rendered as literal text,
  # badges and headings included. GitHub parses it either way, which is why the same
  # file looked right there and wrong in the book.
  - md_in_html
  - mkdocs_graphviz:
      node_color: "000000"
      node_fontcolor: "000000"
      edge_color: "000000"
      edge_fontcolor: "000000"
      graph_color: "000000"
      graph_fontcolor: "000000"
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
  - admonition
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Quickstart: user/quickstart.md
  - User Guide:
      - Introduction: user/intro.md
      - Installation: user/install.md
      - Strategies: user/strategies.md
      - Features:
          - Creating:
              - Constant Values: user/features/creating/constant_values.md
              - Converters and Validation: user/features/creating/converters_and_validation.md
              - Node Decorator: user/features/creating/adding_nodes_using_decorators.md
              - Named Tuples: user/features/creating/automatically_expanding_named_tuples.md
              - Computation Factories: user/features/creating/creating_computation_factories.md
              - Repeated Blocks and Fan-In/Fan-Out: user/features/creating/computation_utilities.md
              - Non-String Node Names: user/features/creating/non_string_node_names.md
              - Tagging Nodes: user/features/creating/tagging_nodes.md
          - Querying:
              - Show as DataFrame: user/features/querying/show_as_dataframe.md
              - View Inputs and Outputs: user/features/querying/view_inputs_outputs.md
              - Visualizing Graphs: user/features/querying/visualizing_computation_graph.md
              - Interactive Widget: user/features/querying/interactive_widget.md
          - Manipulating:
              - Repointing Nodes: user/features/manipulating/repointing_nodes.md
          - Other:
              - Interactive Debugging: user/features/other/interactive_debugging.md
              - Saving Computations: user/features/other/saving_computations.md
              - Serializing Computations: user/features/other/serializing_computations.md
              - Migrating from write_dill: user/features/other/migrating_from_dill.md
  - Notebooks:
      - Overview: notebooks.md
      - CDOs: notebooks/cdos.html
      - Converters and Validation: notebooks/converters.html
      - Interest Rate Swaps: notebooks/interest_rate_swaps.html
      - Portfolio: notebooks/portfolio.html
      - Large Repeated Blocks: notebooks/pipeline_example.html
      - Serialization: notebooks/serialization.html
      - Validation and Planning: notebooks/validation_and_planning.html
      - Live Computation Widget: notebooks/ui_widget.html
  - Reports:
      - Overview: reports.md
      - Test Report: reports/html-report/report.html
      - Coverage Report: reports/html-coverage/index.html
  - API Reference: api.md
  - Developer:
      - Release Checklist: development/release.md
      # One entry where DevContainer, Marimo and Testing used to be three. rhiza 1.x
      # stopped syncing DEVCONTAINER.md, MARIMO.md and TESTS.md into consumers and
      # ships development/rhiza.md instead, which links out to the hosted copies --
      # so the pages this nav pointed at are gone and their content now lives at
      # jebel-quant.github.io/rhiza.
      - Rhiza tooling: development/rhiza.md
      - Contributing: CONTRIBUTING.md
      - Code of Conduct: CODE_OF_CONDUCT.md
